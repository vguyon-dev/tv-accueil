<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Accueil</title>
<style>html, body { margin: 0; height: 100%; background: #0e1116; }</style>
</head>
<body>
<main>
  <header><span id="salut"></span><span id="heure"></span></header>
  <div id="rangees"></div>
  <div id="message"></div>
</main>
<script>
  // Coquille fixe : le module est inscrit dans TizenBrew avec une version épinglée, et cette page
  // ne change plus. Le style et le code viennent de la branche main sur GitHub à chaque ouverture
  // (cache de 5 min au plus) ; si GitHub ne répond pas, on prend la copie livrée avec le module.
  var BRUT = 'https://raw.githubusercontent.com/vguyon-dev/tv-accueil/main/app/';
  var t = '?t=' + Date.now();

  function charger(nom) {
    return fetch(BRUT + nom + t).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).catch(function () {
      return fetch(nom).then(function (r) { return r.text(); });
    });
  }

  Promise.all([charger('accueil.css'), charger('accueil.js')]).then(function (f) {
    var style = document.createElement('style');
    style.textContent = f[0];
    document.head.appendChild(style);
    new Function(f[1])();
  }).catch(function (e) {
    document.getElementById('message').textContent = 'Accueil indisponible : ' + e.message;
  });
</script>
</body>
</html>
